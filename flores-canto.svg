        <path d="M0 0 C -8 -22 -7 -44 0 -62 C 7 -44 8 -22 0 0 Z" transform="rotate(74)"/>
      </g>
      <g fill="#a91b60">
        <path d="M0 0 C -18 -18 -18 -40 0 -52 C 18 -40 18 -18 0 0 Z" transform="rotate(-78)"/>
