      </g>
      <circle r="8" fill="#f47b20"/>
      <circle r="3.5" fill="#a91b60"/>
    </g>

    <!-- Botão sino (magenta com pontos e estames laranja) -->
    <g id="botao">
      <path d="M-13 -2 C -13 -10 13 -10 13 -2 C 13 16 7 27 0 32 C -7 27 -13 16 -13 -2 Z" fill="#a91b60"/>
      <g fill="#ffffff">
        <circle cx="-6" cy="9" r="2.1"/>
        <circle cx="0" cy="14" r="2.1"/>
        <circle cx="6" cy="9" r="2.1"/>
        <circle cx="0" cy="3" r="2.1"/>
      </g>
      <g fill="none" stroke="#f47b20" stroke-width="2.4" stroke-linecap="round">
        <path d="M-8 29 C -10 36 -11 40 -12 45"/>
        <path d="M0 32 L 0 47"/>
        <path d="M8 29 C 10 36 11 40 12 45"/>
      </g>
    </g>

    <!-- Rosa espiral (laranja com contorno magenta) -->
    <g id="rosa">
      <circle r="19" fill="#a91b60"/>
      <circle r="15" fill="#f47b20"/>
      <path d="M0 -9 A 9 9 0 1 1 -7 7 A 5.5 5.5 0 1 0 3.5 3.5" fill="none" stroke="#a91b60" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Gavinha (cachinho verde) -->
    <g id="gavinha">
      <path d="M0 0 C 22 -12 34 6 20 14 C 11 19 7 7 16 4" fill="none" stroke="#2e6417" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

